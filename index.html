<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1013" media="(prefers-color-scheme: dark)">
<meta name="description" content="Undertone — clothes, outfits and shopping matched to your colour type.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Undertone">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Undertone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: utilitarian phone app — sticky header, one view per tab, rounded white cards on soft grey, fixed 5-tab bar */
:root{
  --bg:#F5F5F8; --card:#FFFFFF; --sunk:#EFEFF3; --fg:#1B1B21; --muted:#6C6E7D; --line:#E4E4EB;
  --accent:#7E4A6E; --accent-soft:#F3EAF0; --on-accent:#FFFFFF; --ok:#2F7D6B; --mid:#A8741E; --bad:#B4483C;
  --skin:#E8DCD6; --skin-line:#CDBDB6;
  --r:16px; --font:"Manrope","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1013; --card:#1A1B20; --sunk:#23242A; --fg:#EDEDF1; --muted:#9A9CAA; --line:#2B2D34;
  --accent:#D9A2C4; --accent-soft:#2D2129; --on-accent:#17171C; --ok:#7CC6B2; --mid:#E0B25E; --bad:#EE9184;
  --skin:#5A4F4B; --skin-line:#776A65; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1013; --card:#1A1B20; --sunk:#23242A; --fg:#EDEDF1; --muted:#9A9CAA; --line:#2B2D34;
  --accent:#D9A2C4; --accent-soft:#2D2129; --on-accent:#17171C; --ok:#7CC6B2; --mid:#E0B25E; --bad:#EE9184;
  --skin:#5A4F4B; --skin-line:#776A65; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
html,body{overflow:hidden;overscroll-behavior:none}
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
*{-webkit-tap-highlight-color:transparent}
nav.tabs a{-webkit-touch-callout:none;user-select:none;transition:color .15s}
nav.tabs a:active{color:var(--accent);background:none}
nav.tabs a:focus:not(:focus-visible){outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-left:max(20px,env(safe-area-inset-left,0px),calc((100% - 600px)/2));padding-right:max(20px,env(safe-area-inset-right,0px),calc((100% - 600px)/2));padding-block:16px 24px}
.wrap > section{display:flex;flex-direction:column;gap:12px}
.wrap > section > *{margin-top:0;margin-bottom:0}
#wItems,#wDiary,#sLooks,#sWeek,#sTrip,#sInsp,#shCat,#shCheck,#tripOut{display:flex;flex-direction:column;gap:12px}
:is(#wItems,#wDiary,#sLooks,#sWeek,#sTrip,#sInsp,#shCat,#shCheck,#tripOut) > *{margin-top:0!important;margin-bottom:0!important}
#tripOut:empty,#looksState:empty,#planState:empty,#checkOut:empty{display:none}
header.top{flex:none;position:relative;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{margin:0;font-weight:800;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.mark i{width:22px;height:22px;border-radius:50%;background:conic-gradient(#A9C2DA,#8E99CF,#B6A7CF,#B07A93,#D3A4B0,#A84870,#4F7E86,#78AEA1,#A9C2DA)}
.hdr-r{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;position:relative}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7}
.icon-btn .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pill-btn{height:38px;border-radius:19px;border:0;background:var(--card);padding:0 14px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}

h2.view-title{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
.sub{color:var(--muted);font-size:14px;margin:0}
.card{background:var(--card);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 10px;font-size:16px;font-weight:700}
.card p{margin:0}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:999px;background:var(--fg);color:var(--bg);padding:11px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--sunk);color:var(--fg)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:wait}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.wrapchips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.soft[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.dotchip{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
.dotchip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.field{display:grid;gap:6px;margin-top:10px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;outline:none;min-width:0}
textarea.inp{resize:vertical;min-height:70px}
.inp:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{padding:12px 14px;background:var(--sunk);border-radius:12px;font-size:14px;margin:10px 0}
.loader{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin:10px 0}
.loader i{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}

/* profile */
.me{display:flex;gap:14px;align-items:center}
.avatar{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--sunk);display:grid;place-items:center;font-size:32px;font-weight:800;color:var(--muted);flex:none;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent-soft)}
.avatar img{width:100%;height:100%;object-fit:cover}
.me-r{display:grid;gap:8px;min-width:0;flex:1}
.me-r input{font-size:20px;font-weight:800;border:0;background:transparent;padding:2px 0;outline:none;width:100%;min-width:0}
.season-nm{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:2px 0 0}
.season-nm small{display:block;font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.pal{display:grid;gap:8px;margin-top:12px;cursor:pointer;outline:none}
.pal-strip{display:flex;height:40px;border-radius:10px;overflow:hidden}
.pal-strip b{flex:1;transition:flex .2s}
.pal:hover .pal-strip b:hover{flex:3}
.pal-cap{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.pal-full{display:none;gap:14px;padding-top:6px}
.pal:hover .pal-full,.pal:focus-within .pal-full,.pal.open .pal-full{display:grid}
.pgroup h5{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--muted)}
.sw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px}
.sw div{display:grid;gap:4px;font-size:11px;line-height:1.2;color:var(--muted);min-width:0}
.sw div b{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid rgba(0,0,0,.05)}
.avoid-row{display:flex;gap:6px;flex-wrap:wrap}
.avoid-row span{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--sunk);padding:4px 10px 4px 4px;border-radius:999px}
.avoid-row span b{width:18px;height:18px;border-radius:50%;position:relative;overflow:hidden}
.avoid-row span b::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:2px;background:var(--card);transform:rotate(-45deg)}
dl.kv{margin:0;display:grid;gap:10px}
dl.kv div{display:grid;grid-template-columns:92px 1fr;gap:10px;font-size:14px}
dl.kv dt{color:var(--muted);font-weight:600}
dl.kv dd{margin:0;min-width:0}
.soon{margin-top:12px;padding:12px;border-radius:12px;background:var(--accent-soft);font-size:13px}

/* grids */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{background:var(--card);border:0;border-radius:var(--r);padding:8px 8px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.tile{position:relative;aspect-ratio:1/1.1;max-width:100%;width:100%;border-radius:12px;display:grid;place-items:center;overflow:hidden}
.tile svg.ic{width:62%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.tile img{width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
.heart{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.85);display:grid;place-items:center}
.heart svg{width:17px;fill:none;stroke:#1B1B21;stroke-width:1.7}
.heart[aria-pressed="true"] svg{fill:#7E4A6E;stroke:#7E4A6E}
.score{position:absolute;left:12px;top:12px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.9);color:#1B1B21;display:flex;gap:4px;align-items:center}
.score i{width:8px;height:8px;border-radius:50%}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0;padding:0 4px}
.meta .brand{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .name{font-size:14px;font-weight:700;line-height:1.25}
.meta .col{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.meta .col b{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.1)}
.meta .pr{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.meta .conv{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.add-tile{border:2px dashed var(--line);background:transparent;border-radius:var(--r);display:grid;place-items:center;gap:6px;color:var(--muted);font-weight:700;min-height:180px;padding:12px;text-align:center}
.add-tile svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6}
.empty{padding:22px 16px;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r);font-size:14px;grid-column:1/-1;text-align:center}

/* looks */
.looks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.look{background:var(--card);border:0;border-radius:var(--r);padding:8px 8px 12px;text-align:left;display:grid;gap:8px;min-width:0;position:relative}
.board{aspect-ratio:1/1.05;max-width:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;border-radius:12px;overflow:hidden}
.board > div{display:grid;place-items:center;overflow:hidden}
.board svg.ic{width:72%;height:auto}
.board img{width:80%;height:80%;object-fit:contain}
.look .ttl{font-size:15px;font-weight:700;line-height:1.25;padding:0 4px}
.look .sub2{font-size:12px;color:var(--muted);padding:0 4px}
.dots{display:flex;gap:3px;padding:0 4px}
.dots b{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}

/* week & trip */
.day{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .d{font-weight:800;font-size:15px;line-height:1.1}
.day .d small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.wx{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.wx svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.day .chips{padding-top:6px}
.day .chip{padding:5px 10px;font-size:12px}
.day-look{display:flex;gap:8px;align-items:center;margin-top:8px;background:var(--sunk);border-radius:12px;padding:6px;border:0;width:100%;text-align:left}
.day-look .mini{display:flex;gap:3px}
.day-look .mini span{width:38px;height:42px;border-radius:8px;display:grid;place-items:center;overflow:hidden}
.day-look .mini svg{width:80%}
.day-look .mini img{width:80%;height:80%;object-fit:contain}
.day-look b{font-size:13px}
.pack{display:grid;gap:14px}
.pack h4{margin:0 0 6px;font-size:14px}
.pack label{display:flex;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.pack input{width:18px;height:18px;accent-color:var(--accent)}

/* check */
.verdict{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.verdict img{width:96px;height:120px;object-fit:cover;border-radius:12px;max-width:100%}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;border-radius:4px}
.v-ok{color:var(--ok)}.v-mid{color:var(--mid)}.v-bad{color:var(--bad)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:40vh}
.bubble{max-width:85%;padding:10px 14px;border-radius:18px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.bubble.me{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.composer{flex:none;position:relative;z-index:6;background:var(--bg);padding-block:10px;border-top:1px solid var(--line)}
.composer .in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px}
.composer form{display:flex;gap:8px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:11px 16px;outline:none}
#v-stylist .wrap-pad{display:flex;flex-direction:column;gap:12px}

/* mannequin */
.mq-wrap{display:grid;place-items:center;background:var(--sunk);border-radius:var(--r);padding:12px 0}
.mq-wrap svg{height:360px;max-width:100%}

/* preloader */
.preload{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .35s ease}
.preload.out{opacity:0;pointer-events:none}
.preload .box{display:grid;justify-items:center;gap:14px}
.preload .logo{width:64px;height:64px;border-radius:50%;background:conic-gradient(#A9C2DA,#8E99CF,#B6A7CF,#B07A93,#D3A4B0,#A84870,#4F7E86,#78AEA1,#A9C2DA);-webkit-mask:radial-gradient(circle,transparent 46%,#000 47%);mask:radial-gradient(circle,transparent 46%,#000 47%);animation:spin 1.1s linear infinite}
.preload b{font-weight:800;font-size:20px;letter-spacing:-.03em}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.preload .logo{animation:pulse 1.4s ease-in-out infinite!important}}
@keyframes pulse{50%{opacity:.4}}
/* settings */
.tg{padding:10px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.tg input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tg input:checked{background:var(--accent)}.tg input:checked::after{transform:translateX(18px)}
.savebar{flex:none;position:relative;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-block:10px}
.savebar .in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:10px}
#v-prefs{padding-bottom:0}
.savebar .row{flex-wrap:nowrap;flex:none}
.savebar #saveNote{min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:30}
/* tabs */
nav.tabs{flex:none;position:relative;z-index:7;background:var(--card);border-top:1px solid var(--line);padding-top:6px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs a svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6}
nav.tabs a[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h4{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px}
.sheet .tile{aspect-ratio:4/3}
.sheet .tile svg.ic{width:34%}
.closex{float:right;border:0;background:var(--card);border-radius:999px;font-size:13px;font-weight:700;padding:6px 12px}
.why{display:grid;gap:10px;margin:12px 0}
.why div{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14px}
.why svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.7}
.links{display:grid;gap:8px}

.preview img{width:56px;height:72px;object-fit:cover;border-radius:8px;max-width:100%}
.cutout{display:grid;place-items:center;border-radius:var(--r);min-height:220px;background-color:var(--card);background-image:linear-gradient(45deg,var(--sunk) 25%,transparent 25%,transparent 75%,var(--sunk) 75%),linear-gradient(45deg,var(--sunk) 25%,transparent 25%,transparent 75%,var(--sunk) 75%);background-size:20px 20px;background-position:0 0,10px 10px}
.cutout canvas{max-width:100%;max-height:300px}
input[type=range]{width:100%;accent-color:var(--accent)}
.diary{display:grid;gap:12px}
.entry{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--card);border-radius:var(--r);padding:10px}
.entry img{width:96px;height:128px;object-fit:cover;border-radius:10px;max-width:100%}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:540px){.sw{grid-template-columns:repeat(6,minmax(0,1fr))}.grid,.looks{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ================= COUTURE THEME ================= */
:root{--bg:#F3F2EE;--card:#FAF9F6;--sunk:#EAE8E2;--tile:#EFEDE8;--fg:#1F1E1C;--muted:#86827A;--line:#DCD9D1;--accent:#1F1E1C;--accent-soft:#E7E4DC;--on-accent:#FAF9F6;--ok:#4C6B5F;--mid:#977940;--bad:#9B4A3F;--graphite:#3A3834;--r:2px;
  --font:"Jost","Helvetica Neue",Arial,sans-serif;--serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif}
:root[data-tone="warm"]{--bg:#F5F0E6;--card:#FBF8F2;--sunk:#ECE5D8;--tile:#EFE9DE;--line:#E0D8C9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151412;--card:#1D1C19;--sunk:#262420;--tile:#22201D;--fg:#ECE9E2;--muted:#9A958B;--line:#33302B;--accent:#ECE9E2;--accent-soft:#2C2925;--on-accent:#151412;--graphite:#CFCAC0;--ok:#8DB5A4;--mid:#D1B072;--bad:#D68B7F}}
:root[data-theme="dark"]{--bg:#151412;--card:#1D1C19;--sunk:#262420;--tile:#22201D;--fg:#ECE9E2;--muted:#9A958B;--line:#33302B;--accent:#ECE9E2;--accent-soft:#2C2925;--on-accent:#151412;--graphite:#CFCAC0;--ok:#8DB5A4;--mid:#D1B072;--bad:#D68B7F}
body{font-family:var(--font);font-weight:400;letter-spacing:.01em}
header.top{border-bottom:1px solid var(--line)}
header.top .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.hdr-l{justify-self:start}.hdr-r{justify-self:end}
.mark{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:.34em;margin:0;padding-left:.34em;line-height:1;display:block}
.icon-btn{background:transparent;width:36px;height:36px}
.icon-btn svg{stroke-width:1.2}
.icon-btn .badge{background:var(--fg);color:var(--bg);font-weight:500;font-size:10px}
.pill-btn{background:transparent;border:1px solid var(--line);border-radius:0;height:32px;padding:0 10px;font-weight:500;font-size:11px;letter-spacing:.14em}
h2.view-title{font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:.01em;line-height:1.05}
.sub,.hint{letter-spacing:.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font-family:var(--font);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;margin:0 0 14px}
.eyebrow{font-size:10.5px;font-weight:500;letter-spacing:.2em}
.season-nm{font-family:var(--serif);font-weight:500;font-size:40px;letter-spacing:.01em;line-height:1}
.season-nm small{font-family:var(--font);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-top:8px}
.btn{border-radius:0;font-weight:500;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;padding:13px 20px;border:1px solid var(--fg)}
.btn.acc{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.soft{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:10.5px}
.btn svg{stroke-width:1.3}
.seg{background:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:0;gap:18px;justify-content:flex-start}
.seg button{flex:0 0 auto;border-radius:0;padding:10px 0;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px}
.seg button[aria-pressed="true"]{background:transparent;box-shadow:none;color:var(--fg);border-bottom-color:var(--fg)}
.chip{border-radius:0;background:transparent;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip.soft[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);border-color:var(--fg)}
.dotchip{border-color:var(--bg)}
.inp,select.inp,textarea.inp{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:10px 0}
.inp:focus{border-bottom-color:var(--fg)}
.field label,.flabel{font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.msg{border-radius:0;background:var(--sunk)}
/* garment tiles: paper, pencil line, colour wash */
.tile,.board>div,.links .mini b,.day-look .mini span{position:relative;overflow:hidden;background:var(--tile)}
.tile{border-radius:0;aspect-ratio:3/4}
.blob{position:absolute;left:47%;top:55%;width:60%;aspect-ratio:1;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 38%,transparent) 0%,color-mix(in srgb,var(--c) 62%,transparent) 62%,color-mix(in srgb,var(--c) 92%,transparent) 88%,color-mix(in srgb,var(--c) 40%,transparent) 97%,transparent 100%);opacity:.72;filter:url(#wash);mix-blend-mode:multiply;pointer-events:none}
:root[data-theme="dark"] .blob{mix-blend-mode:normal;opacity:.7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .blob{mix-blend-mode:normal;opacity:.7}}
img.sk{position:absolute;inset:0;margin:auto;width:auto;height:auto;max-width:80%;max-height:84%;object-fit:contain;mix-blend-mode:multiply}
:root[data-theme="dark"] img.sk{filter:invert(1);mix-blend-mode:screen}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) img.sk{filter:invert(1);mix-blend-mode:screen}}
.tile svg.ic,.board svg.ic{position:relative;width:58%}
img.photo{position:relative}
.board{gap:1px;background:var(--line);border-radius:0;aspect-ratio:1/1.1}
.board img.sk{max-height:80%}
.links .mini b img.sk,.day-look .mini span img.sk{max-height:86%}
.links .mini b .blob,.day-look .mini span .blob{width:70%}
.item,.look{background:transparent;border:0;padding:0;border-radius:0;gap:10px}
.meta{padding:0}
.meta .brand{font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.meta .name{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;line-height:1.35}
.meta .pr{font-size:13px;font-weight:400;letter-spacing:.06em}
.look .ttl{font-family:var(--serif);font-size:19px;font-weight:500;padding:0}
.look .sub2,.dots{padding:0}
.heart{background:transparent;top:6px;right:6px}
.heart svg{stroke:var(--graphite);stroke-width:1.3}
.heart[aria-pressed="true"] svg{fill:var(--fg);stroke:var(--fg)}
.score{border-radius:0;background:var(--card);font-weight:500;letter-spacing:.06em;color:var(--fg)}
.add-tile{border:1px dashed var(--line);border-radius:0;font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.empty{border:1px dashed var(--line);border-radius:0}
.links a,.links button{border-radius:0;border:1px solid var(--line);background:var(--card);font-weight:400}
.mq-wrap{border-radius:0;background:var(--tile)}
.avatar{box-shadow:0 0 0 1px var(--line);background:var(--sunk);font-family:var(--serif);font-weight:500}
.pal-strip{border-radius:0}
.sw div b{border-radius:0}
.soon{border-radius:0;background:var(--sunk)}
.tg input:checked{background:var(--fg)}
nav.tabs{background:var(--bg)}
nav.tabs a{font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;gap:6px}
nav.tabs a svg{stroke-width:1.15;width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--fg)}
nav.tabs a:active{color:var(--fg)}
nav.tabs a span{position:relative}
nav.tabs a[aria-current="page"] > span::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;border-radius:50%;background:var(--fg);transform:translateX(-50%)}
.bubble{border-radius:0}.bubble.me{border-bottom-right-radius:0}.bubble.ai{border:1px solid var(--line);border-bottom-left-radius:0}
.composer input{border-radius:0;border:0;border-bottom:1px solid var(--line);background:transparent}
.sheet{border-radius:0;background:var(--bg)}
.sheet h4{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:.01em}
.closex{background:transparent;border-radius:0;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.toast{border-radius:0;font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.savebar{background:var(--bg)}
/* preloader monogram */
.preload .box{gap:18px}
.preload b{font-family:var(--serif);font-weight:500;font-size:18px;letter-spacing:.42em;padding-left:.42em;opacity:0;animation:fadein .8s .3s ease forwards}
.mono{width:54px;height:76px;fill:none;stroke:var(--fg)}
.mono .o1{stroke-width:1.4;stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.6s ease-in-out infinite}
.mono .o2{stroke-width:.8;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.6s .15s ease-in-out infinite}
.mono .u{stroke-width:1.6;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.6s .3s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:var(--len,340)}55%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:.0}}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion: reduce){.mono *{animation:none!important;stroke-dashoffset:0!important}.preload b{opacity:1;animation:none}}
#meName{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:30px;letter-spacing:0;line-height:1.1}
</style>

function detectLocale(){
  let tz="";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){}
  const nl=(navigator.language||"en").toLowerCase();
  let home=(TZ_COUNTRY.find(([r])=>r.test(tz))||[])[1]||"";
  if(!home){const cc=(nl.split("-")[1]||"").toUpperCase();if(cc==="BY"||C_BY[cc])home=cc}
  if(home==="BY"||nl.startsWith("be")||nl==="ru-by") return {lang:"ru",home:"BY",shop:"PL",cur:"BYN",tz};
  const c=C_BY[home];return {lang:"en",home,shop:c?home:"PL",cur:c?c[3]:"EUR",tz};
}

/* ================= images store (IndexedDB) ================= */
const IDB={db:null,mem:new Map(),
  async open(){if(this.db!==null)return this.db;try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open("undertone",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=false}return this.db},
  async set(k,v){this.mem.set(k,v);const db=await this.open();if(!db)return;try{await new Promise((res,rej)=>{const tx=db.transaction("img","readwrite");tx.objectStore("img").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}},
  async get(k){if(this.mem.has(k))return this.mem.get(k);const db=await this.open();if(!db)return null;try{const v=await new Promise((res,rej)=>{const r=db.transaction("img").objectStore("img").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(v)this.mem.set(k,v);return v||null}catch(e){return null}},
  async del(k){this.mem.delete(k);const db=await this.open();if(!db)return;try{db.transaction("img","readwrite").objectStore("img").delete(k)}catch(e){}}
};
async function hydrateImgs(root){for(const el of (root||document).querySelectorAll("img[data-img]")){if(el.dataset.done)continue;const v=await IDB.get(el.dataset.img);if(v){el.src=v;el.dataset.done="1"}}}

const hexOk=h=>/^#[0-9a-f]{6}$/i.test(h||"")?h:"#B6A7CF";
function shade(hex,amt){const n=parseInt(hexOk(hex).slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(v+(amt<0?v*amt:(255-v)*amt))));return"#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function lum(hex){const n=parseInt(hexOk(hex).slice(1),16);return((n>>16)*.299+(n>>8&255)*.587+(n&255)*.114)/255}
function hash(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return(h>>>0)/4294967295}
const loc=()=>({ru:"ru-RU",en:"en-GB"})[S.lang]||S.lang;
function convert(a,from,to){const b=S.rates.byn;if(!b[from]||!b[to])return null;return a*b[from]/b[to]}
function niceRound(v){if(v==null)return 0;if(v>=1000)return Math.round(v/10)*10;if(v>=100)return Math.round(v);return Math.round(v)}
function money(v,cur){const d=v>=100||Number.isInteger(v)?0:2;try{return new Intl.NumberFormat(loc(),{style:"currency",currency:cur,currencyDisplay:"narrowSymbol",maximumFractionDigits:d,minimumFractionDigits:d}).format(v)}catch(e){return Math.round(v)+" "+cur}}

function palette(){
  if(S.season==="Cool Summer"||!S.seasonAI) return CS_PAL.map(([k,h,g,en,ru])=>({key:k,hex:h,group:g,name:dl(en,ru,"c."+k)}));
  return (S.seasonAI.wear||[]).map(([n,h],i)=>({key:"w"+i,hex:hexOk(h),group:"",name:n}));
}
function avoidList(){
  if(S.season==="Cool Summer"||!S.seasonAI) return CS_AVOID.map(([h,en,ru])=>({hex:h,name:dl(en,ru,"av."+en)}));
  return (S.seasonAI.avoid||[]).map(([n,h])=>({hex:hexOk(h),name:n}));
}
const colorBy=key=>palette().find(c=>c.key===key)||palette()[0];
function hex2rgb(h){const n=parseInt(hexOk(h).slice(1),16);return[n>>16,n>>8&255,n&255]}
function rgb2hex(r,g,b){return"#"+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("")}
function rgb2lab([r,g,b]){[r,g,b]=[r,g,b].map(v=>{v/=255;return v>.04045?((v+.055)/1.055)**2.4:v/12.92});
  let x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883;
  const f=v=>v>.008856?Math.cbrt(v):7.787*v+16/116;x=f(x);y=f(y);z=f(z);return[116*y-16,500*(x-y),200*(y-z)]}
function dE(h1,h2){const a=rgb2lab(hex2rgb(h1)),b=rgb2lab(hex2rgb(h2));return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])}
function rate(hex){
  const pal=palette();let best=pal[0],bd=1e9;for(const c of pal){const d=dE(hex,c.hex);if(d<bd){bd=d;best=c}}
  let ad=1e9,aw=null;for(const a of avoidList()){const d=dE(hex,a.hex);if(d<ad){ad=d;aw=a}}
  let score=Math.round(Math.max(0,Math.min(100,100-bd*2.1)));if(aw&&ad<bd&&ad<14)score=Math.min(score,30);
  const lvl=score>=75?"ok":score>=55?"good":score>=35?"mid":"bad";
  return{score,lvl,near:best,avoid:ad<bd&&ad<14?aw:null};
}

function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u})}
function toCanvas(img,max){const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
function removeBg(src,tol){
  const w=src.width,h=src.height,c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(src,0,0);
  const im=x.getImageData(0,0,w,h),d=im.data,N=w*h;
  const border=[];for(let i=0;i<w;i++){border.push(i,(h-1)*w+i)}for(let j=0;j<h;j++){border.push(j*w,j*w+w-1)}
  const med=[0,1,2].map(ch=>{const v=border.map(p=>d[p*4+ch]).sort((a,b)=>a-b);return v[v.length>>1]});
  const dist=p=>Math.hypot(d[p*4]-med[0],d[p*4+1]-med[1],d[p*4+2]-med[2]);
  const bg=new Uint8Array(N),q=[];for(const p of border){if(!bg[p]&&dist(p)<tol*1.4){bg[p]=1;q.push(p)}}
  while(q.length){const p=q.pop(),px=p%w,py=(p-px)/w;
    for(const n of [px>0?p-1:-1,px<w-1?p+1:-1,py>0?p-w:-1,py<h-1?p+w:-1]){if(n<0||bg[n])continue;if(dist(n)<tol){bg[n]=1;q.push(n)}}}
  let removed=0,minx=w,miny=h,maxx=0,maxy=0;
  for(let p=0;p<N;p++){if(bg[p]){d[p*4+3]=0;removed++}else{const px=p%w,py=(p-px)/w;if(px<minx)minx=px;if(px>maxx)maxx=px;if(py<miny)miny=py;if(py>maxy)maxy=py;
    const nb=(px>0&&bg[p-1])||(px<w-1&&bg[p+1])||(py>0&&bg[p-w])||(py<h-1&&bg[p+w]);if(nb)d[p*4+3]=150}}
  x.putImageData(im,0,0);
  const frac=removed/N;if(frac<.04||maxx<=minx)return{canvas:c,frac};
  const pad=6,cx=Math.max(0,minx-pad),cy=Math.max(0,miny-pad),cw=Math.min(w,maxx+pad)-cx,ch=Math.min(h,maxy+pad)-cy;
  const o=document.createElement("canvas");o.width=cw;o.height=ch;o.getContext("2d").drawImage(c,cx,cy,cw,ch,0,0,cw,ch);return{canvas:o,frac};
}
function dominant(canvas,opts={}){
  const x=canvas.getContext("2d"),w=canvas.width,h=canvas.height,d=x.getImageData(0,0,w,h).data,bins=new Map();
  const x0=Math.floor(w*(opts.crop||0)),x1=w-x0,y0=Math.floor(h*(opts.crop||0)),y1=h-y0,step=Math.max(1,Math.floor(Math.sqrt(w*h/20000)));
  let bgc=null;if(opts.skipBorder){const s=[];for(let i=0;i<w;i+=step){s.push(i*4,((h-1)*w+i)*4)}bgc=[0,1,2].map(ch=>{const v=s.map(p=>d[p+ch]).sort((a,b)=>a-b);return v[v.length>>1]})}
  for(let yy=y0;yy<y1;yy+=step)for(let xx=x0;xx<x1;xx+=step){const p=(yy*w+xx)*4;if(d[p+3]<200)continue;const r=d[p],g=d[p+1],b=d[p+2];
    if(bgc&&Math.hypot(r-bgc[0],g-bgc[1],b-bgc[2])<28)continue;
    const k=(r>>4)<<8|(g>>4)<<4|(b>>4);const e=bins.get(k)||[0,0,0,0];e[0]++;e[1]+=r;e[2]+=g;e[3]+=b;bins.set(k,e)}
  let best=null;for(const e of bins.values())if(!best||e[0]>best[0])best=e;
  return best?rgb2hex(best[1]/best[0],best[2]/best[0],best[3]/best[0]):"#888888";
}

let brChain=Promise.resolve();
async function br(tool,input){const r=await mcp.callTool("host:claude_browser",tool,input,{cache:false});return(r.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").split("\n\nTab Context:")[0]}
function readJsonPage(url){if(mcp?.direct)return fetch(url).then(r=>{if(!r.ok)throw{message:"HTTP "+r.status};return r.json()});const p=brChain.then(async()=>{await br("navigate",{url});const tx=await br("get_page_text",{max_chars:60000});const a=Math.min(...["[","{"].map(c=>{const i=tx.indexOf(c);return i<0?1e9:i}));const z=Math.max(tx.lastIndexOf("]"),tx.lastIndexOf("}"));return JSON.parse(tx.slice(a,z+1))});brChain=p.catch(()=>{});return p}

  if(S.shopCountry==="BY"){const T=T_BY[type],c=CS_PAL.find(x=>x[0]===colKey);return`${T?T[4].toLowerCase():type} ${c?c[4].toLowerCase():""}`.trim()}

function storeLink(st,type,colKey){
  const cc=S.shopCountry,C=C_BY[cc]||C_BY.PL,q=itemQuery(type,colKey),e=encodeURIComponent(q);
  if(cc==="PL"){if(st.zara)return`https://www.zara.com/pl/pl/search?searchTerm=${e}&section=${S.gender==="m"?"MAN":"WOMAN"}`;if(st.pl)return st.pl(e);if(st.hm)return`https://www2.hm.com/pl_pl/search-results.html?q=${e}`}

function sat(hex){const[r,g,b]=hex2rgb(hex).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mx===0?0:(mx-mn)/mx}
function neutrals(){const p=palette();const n=p.filter(c=>c.group?c.group==="neutral":sat(c.hex)<.2);return n.length?n:p.slice(0,4)}
function accents(){const n=new Set(neutrals().map(c=>c.key));const a=palette().filter(c=>!n.has(c.key));return a.length?a:palette()}
function pieceFrom(spec){
  if(typeof spec==="string"&&spec.startsWith("w:")){const w=S.wardrobe.find(x=>x.id===spec.slice(2));if(w)return{type:w.type,hex:w.hex,img:"img:"+w.id,name:w.name||typeName(w.type),colorName:rate(w.hex).near.name,wid:w.id}}
  const [type,col]=Array.isArray(spec)?spec:["tee",""];const c=colorBy(col);return{type,colorKey:c.key,hex:c.hex,name:typeName(type),colorName:c.name};
}
function catItem(type,colKey,seg){
  const T=T_BY[type]||T_BY.tee,c=colorBy(colKey),sg=seg||(S.segs[0]||"budget"),[a,b]=T[5][SEGS.indexOf(sg)],h=hash(type+c.key+sg);
  const price=Math.round(a+(b-a)*h);const st=STORES.filter(s=>s.seg===sg&&storeOk(s)&&S.stores.includes(s.id));
  const i=Math.floor(h*Math.max(1,st.length));
  return{id:type+"-"+c.key+"-"+sg,type,cat:T[1],colorKey:c.key,hex:c.hex,colorName:c.name,seg:sg,price,stores:[st[i%st.length],st[(i+1)%st.length]].filter((x,j,arr)=>x&&arr.indexOf(x)===j).map(s=>s.id)};
}
function normItem(it){if(it.color&&!it.hex){it.hex=it.color.hex;it.colorKey=it.color.key;it.colorName=it.color.name}return it}

function buildControls(){return`<div class="seg" id="bMode" style="margin-bottom:8px"><button type="button" data-k="look" aria-pressed="true">${esc(t("build.look"))}</button><button type="button" data-k="one" aria-pressed="false">${esc(t("build.one"))}</button></div>
  <div class="chips" id="bSlot" hidden>${["top","bottom","outer","shoes","bag","acc"].map((s,i)=>`<button type="button" class="chip" data-s="${s}" aria-pressed="${i===0}">${esc(t("slot."+s))}</button>`).join("")}</div>
  <div class="row" style="margin-top:8px"><button class="btn acc sm" type="button" id="bGo">${esc(t("build.go"))}</button>${sample?`<button class="btn soft sm" type="button" id="bAi">${esc(t("build.ai"))}</button>`:""}</div>`}
const SLOT_TYPES={top:["turtleneck","knit","blouse","tee"],bottom:["trousers","skirt","jeans"],outer:["coat","trench","blazer"],shoes:["boots","pumps"],bag:["bag"],acc:["scarf"],dress:["dress"]};
const NEED={top:["bottom","outer","shoes","bag"],bottom:["top","outer","shoes","bag"],dress:["outer","shoes","bag"],outer:["top","bottom","shoes","bag"],shoes:["top","bottom","bag"],bag:["top","bottom","shoes"],acc:["top","bottom","outer","shoes"]};
function harmonize(base,slot,n,seed){
  const isNeutral=sat(base.hex)<.2,neu=neutrals().filter(c=>dE(c.hex,base.hex)>12),acc=accents().filter(c=>dE(c.hex,base.hex)>12);
  const pool=(slot==="top"||slot==="bag"||slot==="acc")&&isNeutral?acc:neu.length?neu:palette();
  const out=[];for(let i=0;i<n;i++){const h=hash(seed+slot+i);out.push(pool[Math.floor(h*pool.length)%pool.length])}
  return out;
}
function localBuild(base,mode,slot){
  const bslot=T_BY[base.type]?.[2]||"top",seed=base.hex+base.type;
  if(mode==="one"){const types=SLOT_TYPES[slot];return harmonize(base,slot,3,seed).map((c,i)=>pieceFrom([types[i%types.length],c.key]))}
  const pieces=[base];
  for(const s of NEED[bslot]){
    const own=S.wardrobe.find(w=>w.id!==base.wid&&T_BY[w.type]?.[2]===s&&rate(w.hex).score>=55&&dE(w.hex,base.hex)>12);
    if(own){pieces.push(pieceFrom("w:"+own.id));continue}
    const types=SLOT_TYPES[s],c=harmonize(base,s,1,seed)[0];pieces.push(pieceFrom([types[Math.floor(hash(seed+s)*types.length)],c.key]));
  }
  return pieces;
}
function piecesHtml(pieces,withMq){
  return`${withMq?`<div class="mq-wrap" style="margin:10px 0">${mannequin(pieces)}</div>`:""}<div class="links">${pieces.map((p,i)=>`<button type="button" data-pi="${i}"><span class="mini"><b style="background:${tileBg(p.hex)}">${pieceVis(p)}</b><span>${esc(p.name)}${p.colorName?" · "+esc(p.colorName):""}</span></span><span>${p.wid?esc(t("build.mine")):esc(t("item.shop"))}</span></button>`).join("")}</div>`;
}
function wireBuild(base){
  let mode="look",slot="top";
  $("bMode").onclick=e=>{const k=e.target.closest("[data-k]")?.dataset.k;if(!k)return;mode=k;$("bMode").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));$("bSlot").hidden=k!=="one"};
  $("bSlot").onclick=e=>{const s=e.target.closest("[data-s]")?.dataset.s;if(!s)return;slot=s;$("bSlot").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===s))};
  const show=pieces=>{const list=mode==="look"?pieces:pieces;$("buildOut").innerHTML=piecesHtml(list,mode==="look");hydrateImgs($("buildOut"));
    $("buildOut").querySelector(".links").onclick=e=>{const b=e.target.closest("[data-pi]");if(!b)return;const p=list[+b.dataset.pi];if(p.wid){const w=S.wardrobe.find(x=>x.id===p.wid);if(w&&w.id!==base.wid)openWardItem(w);return}openItem(catItem(p.type,p.colorKey))};};

function weekDays(){const have=Object.fromEntries((S.week.days||[]).map(d=>[d.date,d]));return[0,1,2,3,4,5,6].map(i=>{const date=todayISO(i);return have[date]||{date,manual:true,tcat:S.week.tcat?.[date]||"cool"}})}

async function forecast(city,start,days,coords){
  let p=coords;
  if(!p){const g=await readJsonPage(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en`);p=g.results?.[0];if(!p)throw{message:t("week.noCity")}}
  let url=`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&current=temperature_2m,weather_code&timezone=auto`;
  url+=start?`&start_date=${start}&end_date=${days}`:`&forecast_days=${days}`;
  const f=await readJsonPage(url);const D=f.daily||{};
  const cur=f.current?{t:f.current.temperature_2m,code:f.current.weather_code,at:Date.now()}:null;
  return{place:[p.name,p.country].filter(Boolean).join(", "),lat:p.latitude,lon:p.longitude,now:cur,days:(D.time||[]).map((d,i)=>({date:d,tmax:D.temperature_2m_max[i],tmin:D.temperature_2m_min[i],pp:D.precipitation_probability_max?.[i]??0,code:D.weather_code?.[i]??3}))};
}

function pickLook(occ,tc,rain,used){
  const all=allLooks();let c=all.filter(l=>(l.occ||[]).includes(occ)&&(!l.temp||l.temp.includes(tc))&&!used.has(l.id));
  if(rain)c.sort((a,b)=>(b.items.some(i=>i[0]==="trench")?1:0)-(a.items.some(i=>i[0]==="trench")?1:0));
  if(!c.length)c=all.filter(l=>(!l.temp||l.temp.includes(tc))&&!used.has(l.id));if(!c.length)c=all;
  const l=c[0];used.add(l.id);
  let items=l.items.map(x=>x);const own=S.wardrobe.filter(w=>rate(w.hex).score>=55);
  items=items.map(it=>{if(typeof it==="string")return it;const s=T_BY[it[0]]?.[2];const w=own.find(w=>T_BY[w.type]?.[2]===s&&!used.has("w"+w.id));if(w&&hash(l.id+w.id)>.4){used.add("w"+w.id);return"w:"+w.id}return it});
  return{...l,items};
}

function buildCatalog(){

  TYPES.forEach(([key,cat,,,,,pref],ti)=>{
    const cols=isCS?pref.map(k=>pal.find(c=>c.key===k)).filter(Boolean):[0,1,2,3].map(i=>pal[(ti*3+i)%pal.length]).filter(Boolean);

}

let D=null;
const fmtT=c=>S.tempUnit==="F"?Math.round(c*9/5+32)+"°F":Math.round(c)+"°C";
function applyTheme(){const r=document.documentElement;r.dataset.tone=/Spring|Autumn/.test(S.season)?"warm":"cool";if(S.theme==="light"||S.theme==="dark")r.dataset.theme=S.theme;else if(!window.claude)r.removeAttribute("data-theme")}
function startPrefs(){D=JSON.parse(JSON.stringify({avatar:S.avatar,name:S.name,gender:S.gender,lang:S.lang,shopCountry:S.shopCountry,currency:S.currency,geo:S.geo,notif:S.notif,theme:S.theme,tempUnit:S.tempUnit,city:S.week.city||"",useGeo:S.useGeo,segs:S.segs}));renderPrefs()}
function dirty(){if(!D)return false;const c=JSON.parse(JSON.stringify({avatar:S.avatar,name:S.name,gender:S.gender,lang:S.lang,shopCountry:S.shopCountry,currency:S.currency,geo:S.geo,notif:S.notif,theme:S.theme,tempUnit:S.tempUnit,city:S.week.city||"",useGeo:S.useGeo,segs:S.segs}));return JSON.stringify(c)!==JSON.stringify(D)}
function markDirty(){$("saveNote").textContent=dirty()?t("set.unsaved"):"";$("prefSave").disabled=!dirty()}
function renderPrefs(){
  if(!D)return;
  renderAvatarIn($("pAvatar"),D.avatar,D.name);$("avRemove").hidden=!D.avatar;$("nameIn").value=D.name||"";
  segHtml("gender",[["f",t("g.f")],["m",t("g.m")]],D.gender);
  $("langSel").innerHTML=LANGS.filter(([k])=>sample||k==="en"||k==="ru"||S.tr[k]).map(([k,n])=>`<option value="${k}" ${k===D.lang?"selected":""}>${n}</option>`).join("");
  $("langHint").textContent=!["en","ru"].includes(D.lang)&&S.tr[D.lang]?t("lang.ai"):"";
  $("shopCountry").innerHTML=COUNTRIES.map(c=>`<option value="${c[0]}" ${c[0]===D.shopCountry?"selected":""}>${esc(S.lang==="ru"?c[2]:c[1])}</option>`).join("");
  $("curSel").innerHTML=curOptions(D.currency);
  $("geoHint").textContent=D.geo?.src==="ip"?t("geo.ip",{x:D.geo.label}):D.geo?.src==="manual"?t("geo.manual"):t("geo.tz",{x:D.geo?.label||"—"});
  $("ipBtn").hidden=!mcp;
  $("nDaily").checked=!!D.notif.daily;$("nTime").value=D.notif.time||"08:00";$("nTime").disabled=!D.notif.daily;$("nWeather").checked=!!D.notif.weather;$("nDiary").checked=!!D.notif.diary;
  const np=("Notification" in window)?Notification.permission:"na";
  $("nHint").textContent=window.claude?t("set.notifNA"):np==="denied"?t("set.notifDenied"):np==="na"?t("set.notifNA"):t("set.notifHint");
  segHtml("tUnit",[["C","°C"],["F","°F"]],D.tempUnit);
  $("prefCity").value=D.city;$("prefGeo").checked=!!D.useGeo;$("prefGeo").closest("label").hidden=!(mcp?.direct&&navigator.geolocation);
  segHtml("prefSegs",SEGS.map(k=>[k,t("seg."+k)]),"");$("prefSegs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",D.segs.includes(b.dataset.k)));
  segHtml("themeSeg",[["auto",t("theme.auto")],["light",t("theme.light")],["dark",t("theme.dark")]],D.theme);
  $("exportBtn").hidden=!!window.claude;$("aboutLine").textContent="Undertone · v7 · "+t("set.local");
  markDirty();
}
async function pickAvatar(file){if(!file)return;const img=await loadImage(file);const c=document.createElement("canvas"),sz=320;c.width=c.height=sz;const k=Math.max(sz/img.width,sz/img.height),w=img.width*k,h=img.height*k;c.getContext("2d").drawImage(img,(sz-w)/2,(sz-h)/2,w,h);try{D.avatar=c.toDataURL("image/jpeg",.85)}catch(e){}renderPrefs()}
$("avGallery").onchange=e=>{pickAvatar(e.target.files[0]);e.target.value=""};
$("avCamera").onchange=e=>{pickAvatar(e.target.files[0]);e.target.value=""};
$("avRemove").onclick=()=>{D.avatar="";renderPrefs()};
$("nameIn").oninput=()=>{D.name=$("nameIn").value.trim();renderAvatarIn($("pAvatar"),D.avatar,D.name);markDirty()};
$("gender").onclick=e=>{const k=e.target.closest("[data-k]")?.dataset.k;if(!k)return;D.gender=k;renderPrefs()};
$("shopCountry").onchange=e=>{D.shopCountry=e.target.value;if(D.geo?.src!=="manual"){const c=C_BY[D.shopCountry];if(c&&!(D.shopCountry==="PL"&&D.currency==="BYN"))D.currency=c[3]}renderPrefs()};
$("curSel").onchange=e=>{D.currency=e.target.value;D.geo={src:"manual"};renderPrefs()};
$("ipBtn").onclick=async()=>{const b=$("ipBtn");b.disabled=true;
  try{const r=await readJsonPage("https://ipapi.co/json/");const cc=String(r.country_code||"").toUpperCase();
    if(cc==="BY"){D.shopCountry="PL";D.currency="BYN"}else if(C_BY[cc]){D.shopCountry=cc;D.currency=C_BY[cc][3]}else{const cur=String(r.currency||"").toUpperCase();if(S.rates.byn[cur])D.currency=cur}
    D.geo={src:"ip",label:[r.city,r.country_name].filter(Boolean).join(", ")};renderPrefs()}catch(e){$("geoHint").textContent=brErr(e)}finally{b.disabled=false}};
$("langSel").onchange=async e=>{
  const lg=e.target.value;
  if(lg==="en"||lg==="ru"||S.tr[lg]){D.lang=lg;renderPrefs();return}
  if(!sample){$("langHint").textContent=t("lang.needAi");e.target.value=D.lang;return}
  $("langHint").textContent=t("lang.translating");
  const dict={...EN};CS_PAL.forEach(([k,,,en])=>dict["c."+k]=en);TYPES.forEach(([k,,,en])=>dict["i."+k]=en);
  STYLE_TAGS.forEach(([k,en])=>dict["s."+k]=en);AVOID_TAGS.forEach(([k,en])=>dict["a."+k]=en);BODY.forEach(([k,en])=>dict["b."+k]=en);KIBBE.forEach(([k,en])=>dict["k."+k]=en);LARSON.forEach(([k,en])=>dict["lr."+k]=en);
  LOOKS.forEach(([id,en])=>dict["l."+id]=en);CS_AVOID.forEach(([,en])=>dict["av."+en]=en);dict["cs.desc"]=CS_TEXT.en.desc;
  const name=LANGS.find(x=>x[0]===lg)[1];
  try{const r=await sample.json(`Translate the values of this JSON object from English into ${name} for a fashion app UI. Keep keys and {placeholders} unchanged; short and natural. Reply with ONLY the JSON object.\n\n${JSON.stringify(dict)}`,{cache:{gcTime:86400000}});
    if(!r||typeof r!=="object")throw{code:"invalid_json"};S.tr[lg]=r;persist();D.lang=lg;renderPrefs();
  }catch(err){$("langHint").textContent=errText(err);e.target.value=D.lang}
};
$("nDaily").onchange=async e=>{D.notif.daily=e.target.checked;if(e.target.checked)await askNotif();renderPrefs()};
$("nTime").onchange=e=>{D.notif.time=e.target.value||"08:00";markDirty()};
$("nWeather").onchange=async e=>{D.notif.weather=e.target.checked;if(e.target.checked)await askNotif();renderPrefs()};
$("nDiary").onchange=async e=>{D.notif.diary=e.target.checked;if(e.target.checked)await askNotif();renderPrefs()};
async function askNotif(){try{if("Notification" in window&&Notification.permission==="default")await Notification.requestPermission()}catch(e){}}
$("tUnit").onclick=e=>{const k=e.target.closest("[data-k]")?.dataset.k;if(!k)return;D.tempUnit=k;renderPrefs()};
$("prefCity").oninput=e=>{D.city=e.target.value.trim();markDirty()};
$("prefGeo").onchange=e=>{D.useGeo=e.target.checked;markDirty()};
$("prefSegs").onclick=e=>{const k=e.target.closest("[data-k]")?.dataset.k;if(!k)return;if(D.segs.includes(k)){if(D.segs.length>1)D.segs=D.segs.filter(x=>x!==k)}else D.segs=[...D.segs,k];renderPrefs()};
$("themeSeg").onclick=e=>{const k=e.target.closest("[data-k]")?.dataset.k;if(!k)return;D.theme=k;renderPrefs()};
$("prefCancel").onclick=()=>{startPrefs()};
function toast(msg){const el=document.createElement("div");el.className="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
$("prefSave").onclick=()=>{
  if(!D)return;const oldCur=shopCur(),cityChanged=(S.week.city||"")!==D.city,geoOn=D.useGeo&&!S.useGeo;
  Object.assign(S,{avatar:D.avatar,name:D.name,gender:D.gender,lang:D.lang,shopCountry:D.shopCountry,currency:D.currency,geo:D.geo,notif:D.notif,theme:D.theme,tempUnit:D.tempUnit,useGeo:D.useGeo,segs:D.segs});
  S.stores=[...new Set([...S.stores,...STORES.filter(s=>s.only?.includes(S.shopCountry)).map(s=>s.id)])];
  const nc=shopCur();if(oldCur!==nc){S.pmin=niceRound(convert(S.pmin,oldCur,nc)||0);S.pmax=niceRound(convert(S.pmax,oldCur,nc)||0)}
  if(cityChanged){S.week.city=D.city;S.week.lat=null;S.week.days=[];S.week.now=null}
  persist();renderAll();startPrefs();toast(t("set.saved"));
  if(geoOn)geoWeather(true);else if(cityChanged&&D.city&&mcp)forecast(D.city,null,7).then(r=>{Object.assign(S.week,{days:r.days,city:r.place,lat:r.lat,lon:r.lon,now:r.now});persist();renderWeek()}).catch(()=>{});
};
window.addEventListener("beforeunload",e=>{if(location.hash==="#prefs"&&dirty()){e.preventDefault();e.returnValue=""}});
/* data */
$("exportBtn").onclick=async()=>{const imgs={};for(const w of S.wardrobe)imgs["img:"+w.id]=await IDB.get("img:"+w.id);for(const d of S.diary)imgs["img:"+d.id]=await IDB.get("img:"+d.id);
  const blob=new Blob([JSON.stringify({app:"undertone",v:7,state:S,imgs})],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`undertone-backup-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();$("dataHint").textContent=t("set.exported")};
$("importFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const j=JSON.parse(await f.text());if(j.app!=="undertone"||!j.state)throw 0;for(const[k,v]of Object.entries(j.imgs||{}))if(v)await IDB.set(k,v);
    Object.assign(S,j.state);persist();renderAll();startPrefs();toast(t("set.imported"))}catch(err){$("dataHint").textContent=t("set.importFail")}};
$("resetBtn").onclick=()=>{$("resetConfirm").hidden=false};
$("resetNo").onclick=()=>{$("resetConfirm").hidden=true};
$("resetYes").onclick=async()=>{for(const w of S.wardrobe)await IDB.del("img:"+w.id);for(const d of S.diary)await IDB.del("img:"+d.id);try{localStorage.removeItem(LS);localStorage.removeItem("undertone.v3")}catch(e){}location.hash="profile";location.reload()};
/* notifications (standalone app) */
async function notify(title,body,tag){try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.showNotification(title,{body,tag,icon:"icon-192.png",badge:"icon-192.png"});else new Notification(title,{body,tag})}catch(e){}}
async function maybeNotify(){
  if(window.claude||!("Notification" in window)||Notification.permission!=="granted")return;
  const N=S.notif,today=todayISO(),now=new Date(),hm=now.toTimeString().slice(0,5);N.last=N.last||{};
  if(S.week.lat!=null)await autoWeather();
  const day=(S.week.days||[]).find(d=>d.date===today);
  if(N.daily&&hm>=(N.time||"08:00")&&N.last.daily!==today){
    const plan=S.week.plan?.[today]||pickLook(new Date().getDay()%6===0?"weekend":"office",day?tempCat(day):"cool",day&&wxKind(day)==="rain",new Set());
    const wx=day?` · ${fmtT(day.tmin)}…${fmtT(day.tmax)}`:"";
    await notify(t("notif.dailyTitle"),`${plan.name}${wx}`,"daily");N.last.daily=today;persist();
  }
  if(N.weather&&day&&N.last.weather!==today&&(wxKind(day)==="rain"||day.tmin<0)){await notify(t("notif.wxTitle"),wxKind(day)==="rain"?t("notif.rain",{p:day.pp}):t("notif.cold",{t:fmtT(day.tmin)}),"weather");N.last.weather=today;persist()}
  if(N.diary&&hm>="19:00"&&N.last.diary!==today&&!S.diary.some(d=>d.date===today)){await notify(t("notif.diaryTitle"),t("notif.diary"),"diary");N.last.diary=today;persist()}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){autoWeather();maybeNotify()}});
setInterval(maybeNotify,5*60e3);

/* ================= sheets / saved / routing ================= */
function openSheet(html){const r=$("sheetRoot");r.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;$("scrim").onclick=e=>{if(e.target.id==="scrim")closeSheet()};r.querySelector(".closex")?.addEventListener("click",closeSheet)}
function closeSheet(){$("sheetRoot").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function renderSaved(){
  $("savedLooks").innerHTML=S.favLooks.map((l,i)=>lookCard(l,"f",i)).join("");$("savedLooks").hidden=!S.favLooks.length;
  $("saved").innerHTML=S.favs.length?S.favs.map((it,i)=>cardHtml(it,"f",i)).join(""):(S.favLooks.length?"":`<div class="empty">${esc(t("saved.empty"))}</div>`);
}
const VIEWS=["profile","prefs","wardrobe","style","shop","stylist","saved"];
function route(){
  const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):"shop";
  if(v==="prefs"&&prevView!=="prefs")startPrefs();prevView=v;
  VIEWS.forEach(k=>$("v-"+k).hidden=k!==v);$("composer").hidden=v!=="stylist";$("saveBar").hidden=v!=="prefs";
  const tv=v==="prefs"?"profile":v;
  document.querySelectorAll("nav.tabs a").forEach(a=>a.dataset.v===tv?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  $("app").querySelector("main").scrollTop=0;
}
window.addEventListener("hashchange",route);
let prevView="";
function renderAll(){applyTheme();applyI18n();renderHeader();renderProfile();renderWardrobe();renderStyle();renderShop();renderChat();renderSaved();hydrateImgs()}
renderAll();route();
setTimeout(()=>{const p=$("preload");if(p){p.classList.add("out");setTimeout(()=>p.remove(),400)}},700);

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
